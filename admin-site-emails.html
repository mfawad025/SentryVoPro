<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Site Emails — SentryVo Admin</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;600;700;800&family=Instrument+Sans:wght@400;500;600;700&family=Martian+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
<link rel="icon" type="image/png" href="assets/logo-icon.png">
<link rel="stylesheet" href="style.css">
</head>
<body>

<section style="padding:48px 0;">
  <div class="wrap" style="max-width:1000px;">
    <div style="background:var(--paper-2); border:1px solid var(--line); box-shadow:0 30px 60px -40px var(--shadow); border-radius:16px; padding:32px;">
      <span class="eyebrow">Admin Only — Not Linked From Site Navigation</span>
      <h2 style="margin:8px 0 6px;">Website DMCA emails</h2>
      <p style="font-size:.88rem; color:var(--text-low); margin-bottom:20px;">
        These are the addresses SentryVo sends takedown notices to. One email per website.
        Change an address and press Save. Characters such as <code>+</code> are kept as typed.
      </p>

      <div style="display:flex; gap:12px; flex-wrap:wrap; align-items:flex-end; margin-bottom:16px;">
        <div class="field" style="flex:1; min-width:220px; margin:0;">
          <label for="admin-key">Admin key</label>
          <input type="password" id="admin-key" autocomplete="off">
        </div>
        <button type="button" class="btn btn-primary" id="load-btn">Load list</button>
      </div>
      <p class="confirm-note" id="status" style="min-height:1.2em; font-size:.85rem; margin:0 0 16px;"></p>

      <div id="panel" style="display:none;">
        <div style="display:flex; gap:12px; flex-wrap:wrap; align-items:flex-end; margin-bottom:20px; padding:16px; border:1px solid var(--line); border-radius:12px;">
          <div class="field" style="flex:1; min-width:180px; margin:0;">
            <label for="new-domain">Add a website</label>
            <input type="text" id="new-domain" placeholder="example.com" autocomplete="off">
          </div>
          <div class="field" style="flex:1.3; min-width:220px; margin:0;">
            <label for="new-email">Its DMCA email</label>
            <input type="text" id="new-email" placeholder="dmca+name@gmail.com" autocomplete="off">
          </div>
          <button type="button" class="btn btn-primary" id="add-btn">Add</button>
        </div>

        <div style="display:flex; gap:12px; align-items:center; justify-content:space-between; flex-wrap:wrap; margin-bottom:10px;">
          <input type="text" id="filter" placeholder="Search by website or email" style="flex:1; min-width:200px; padding:9px 12px; border:1px solid var(--line); border-radius:10px; background:#fff; font:inherit; color:inherit;" autocomplete="off">
          <span id="count" style="font-size:.85rem; color:var(--text-low);"></span>
        </div>

        <div style="overflow-x:auto;">
          <table style="width:100%; border-collapse:collapse; font-size:.88rem;">
            <thead>
              <tr style="text-align:left; border-bottom:2px solid var(--line);">
                <th style="padding:8px;">Website</th>
                <th style="padding:8px; min-width:260px;">DMCA email</th>
                <th style="padding:8px;">Last changed</th>
                <th style="padding:8px;"></th>
              </tr>
            </thead>
            <tbody id="rows"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</section>

<script src="script.js"></script>
<script>
  let entries = [];
  const statusEl = document.getElementById('status');
  const keyEl = document.getElementById('admin-key');

  function say(text, ok) {
    statusEl.textContent = text;
    statusEl.style.color = ok ? 'var(--sage)' : 'var(--rust)';
  }
  function esc(s) {
    return String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }
  function looksValid(email) {
    return /^[^\s@,;]+@[^\s@,;]+\.[^\s@,;]+$/.test(email);
  }
  function api(path, options) {
    const sep = path.includes('?') ? '&' : '?';
    return fetch(`${SENTRYVO_BACKEND_URL}${path}${sep}key=${encodeURIComponent(keyEl.value.trim())}`, options)
      .then(async (res) => {
        const data = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error(data.error || 'Request failed');
        return data;
      });
  }

  function render() {
    const term = document.getElementById('filter').value.trim().toLowerCase();
    const shown = entries.filter((e) => !term || e.domain.toLowerCase().includes(term) || e.email.toLowerCase().includes(term));
    document.getElementById('count').textContent = `${shown.length} of ${entries.length} websites`;
    document.getElementById('rows').innerHTML = shown.map((e) => {
      const bad = !looksValid(e.email);
      const changed = e.updated_at ? new Date(e.updated_at).toLocaleDateString() : '';
      return `<tr style="border-bottom:1px solid var(--line);">
        <td style="padding:8px; word-break:break-all;"><strong>${esc(e.domain)}</strong></td>
        <td style="padding:8px;"><input type="text" value="${esc(e.email)}" data-domain="${esc(e.domain)}" class="email-input" style="width:100%; padding:9px 12px; border:1px solid var(--line); border-radius:10px; background:#fff; font:inherit; color:inherit; ${bad ? 'border-color:var(--rust);' : ''}" autocomplete="off">${bad ? '<div style="color:var(--rust); font-size:.75rem;">Not a valid email</div>' : ''}</td>
        <td style="padding:8px; white-space:nowrap; color:var(--text-low);">${esc(changed)}</td>
        <td style="padding:8px; white-space:nowrap;">
          <button type="button" class="btn btn-primary" data-save="${esc(e.domain)}" style="padding:6px 14px;">Save</button>
          <button type="button" class="btn" data-resend="${esc(e.domain)}" style="padding:6px 14px;" title="Send new notices for links on this website">Re-report</button>
          <button type="button" class="btn" data-delete="${esc(e.domain)}" style="padding:6px 14px;">Delete</button>
        </td>
      </tr>`;
    }).join('') || '<tr><td colspan="4" style="padding:16px; color:var(--text-low);">No websites match.</td></tr>';
  }

  async function load() {
    say('Loading…', true);
    try {
      const data = await api('/api/admin/site-emails/list');
      entries = data.entries.sort((a, b) => a.domain.localeCompare(b.domain));
      document.getElementById('panel').style.display = 'block';
      render();
      const bad = entries.filter((e) => !looksValid(e.email)).length;
      say(bad ? `Loaded ${entries.length} websites. ${bad} have an invalid email (marked in red).` : `Loaded ${entries.length} websites.`, !bad);
    } catch (err) { say(err.message, false); }
  }

  async function save(domain, email) {
    const data = await api('/api/admin/site-emails/save', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ domain, email }),
    });
    return data;
  }

  document.getElementById('load-btn').addEventListener('click', load);
  document.getElementById('filter').addEventListener('input', render);

  document.getElementById('add-btn').addEventListener('click', async () => {
    try {
      const data = await save(document.getElementById('new-domain').value, document.getElementById('new-email').value);
      document.getElementById('new-domain').value = '';
      document.getElementById('new-email').value = '';
      say(`Saved ${data.domain}: ${data.email}`, true);
      await load();
    } catch (err) { say(err.message, false); }
  });

  document.getElementById('rows').addEventListener('click', async (ev) => {
    const btn = ev.target.closest('button');
    if (!btn) return;
    try {
      if (btn.dataset.save) {
        const domain = btn.dataset.save;
        const input = document.querySelector(`input[data-domain="${CSS.escape(domain)}"]`);
        const data = await save(domain, input.value);
        say(`Saved ${data.domain}: ${data.email}`, true);
        const entry = entries.find((e) => e.domain === domain);
        if (entry) { entry.email = data.email; entry.updated_at = new Date().toISOString(); }
        render();
      } else if (btn.dataset.delete) {
        const domain = btn.dataset.delete;
        if (!confirm(`Remove ${domain} from the list? Notices for it will then go to a guessed address.`)) return;
        await api(`/api/admin/site-emails/delete?domain=${encodeURIComponent(domain)}`);
        entries = entries.filter((e) => e.domain !== domain);
        say(`Removed ${domain}`, true);
        render();
      } else if (btn.dataset.resend) {
        const domain = btn.dataset.resend;
        if (!confirm(`Put all reported links on ${domain} (all clients) back to "Leak Found"? The next scan will send new notices to the email above. Save the email first if you changed it.`)) return;
        const data = await api(`/api/admin/rereport?domains=${encodeURIComponent(domain)}`);
        const total = (data.reset || []).reduce((n, r) => n + r.links, 0);
        say(`${total} link(s) on ${domain} will be sent again on the next scan.`, true);
      }
    } catch (err) { say(err.message, false); }
  });
</script>
</body>
</html>
