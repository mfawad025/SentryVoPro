<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forgot Password — SentryVo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="icon" type="image/png" href="assets/logo-icon.png">
<link rel="canonical" href="https://www.sentryvo.com/forgot-password.html">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="site-header">
  <div class="wrap nav">
    <a href="index.html" class="logo">
      <img src="assets/logo-nav.png" alt="SentryVo — Protect What You Create" loading="eager">
    </a>
    <nav class="nav-links">
      <a href="pricing.html">Pricing</a>
    </nav>
    <a href="register.html" class="nav-cta">Get Protected</a>
  </div>
</header>

<section style="padding:90px 0;">
  <div class="wrap" style="max-width:420px;">
    <div style="background:var(--ink-2); border:1px solid var(--line); border-radius:16px; padding:40px;">
      <h2 style="text-align:center; margin-bottom:6px;">Forgot your password?</h2>
      <p style="text-align:center; font-size:.88rem; color:var(--text-low); margin-bottom:28px;">Enter your account email and we'll send you a link to reset it.</p>

      <form id="forgot-form">
        <div class="field">
          <label for="forgot-email">Email address</label>
          <input type="email" id="forgot-email" required autocomplete="email">
        </div>
        <button type="submit" class="btn btn-primary btn-block" id="forgot-submit">Send Reset Link</button>
        <p class="confirm-note" id="forgot-status" style="min-height:1.2em; font-size:.82rem; color:var(--text-low); margin-top:12px; text-align:center;"></p>
      </form>
      <p style="text-align:center; font-size:.85rem; color:var(--text-low); margin-top:18px;">
        <a href="login.html" style="color:var(--rust);">Back to Login</a>
      </p>
    </div>
  </div>
</section>

<footer class="site-footer">
  <div class="wrap">
    <div class="footer-bottom">
      <span>© 2026 SentryVo. All rights reserved.</span>
      <a href="https://x.com/SentryVo" target="_blank" rel="noopener noreferrer" style="color:inherit; display:inline-flex; align-items:center; margin:0 10px;" aria-label="SentryVo on X"><svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M18.9 2H22l-7.6 8.7L23 22h-6.9l-5.4-6.6L4.4 22H1.3l8.1-9.3L1 2h7l4.9 6.1L18.9 2Zm-1.2 18h1.9L7.4 4h-2l12.3 16Z"/></svg></a>
      <span>support@sentryvo.com</span>
    </div>
  </div>
</footer>

<script src="script.js"></script>
<script>
  document.getElementById('forgot-form').addEventListener('submit', async function (e) {
    e.preventDefault();
    const submitBtn = document.getElementById('forgot-submit');
    const statusEl = document.getElementById('forgot-status');
    const email = document.getElementById('forgot-email').value.trim();

    if (!email) return;

    submitBtn.disabled = true;
    submitBtn.textContent = 'Sending…';
    statusEl.textContent = '';

    try {
      const res = await fetch(`${SENTRYVO_BACKEND_URL}/api/forgot-password`, {
        method: 'POST',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ email }),
      });
      const data = await res.json().catch(() => ({}));

      // The backend deliberately returns the same message whether or not
      // the account exists, so this text is always shown on success.
      statusEl.textContent = data.message || 'If an account exists with that email, a reset link has been sent.';
      statusEl.style.color = 'var(--sage)';
      document.getElementById('forgot-form').reset();
    } catch (err) {
      statusEl.textContent = 'Could not reach the server. Please try again in a moment.';
      statusEl.style.color = '#0096F5';
    } finally {
      submitBtn.disabled = false;
      submitBtn.textContent = 'Send Reset Link';
    }
  });
</script>
</body>
</html>
