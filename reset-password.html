<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset Password — SentryVo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="icon" type="image/png" href="assets/logo-icon.png">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="site-header">
  <div class="wrap nav">
    <a href="index.html" class="logo">
      <img src="assets/logo-nav.png" alt="SentryVo — Protect What You Create" loading="eager">
    </a>
    <nav class="nav-links">
      <a href="pricing.html">Pricing</a>
    </nav>
    <a href="register.html" class="nav-cta">Get Protected</a>
  </div>
</header>

<section style="padding:90px 0;">
  <div class="wrap" style="max-width:420px;">
    <div style="background:var(--ink-2); border:1px solid var(--line); border-radius:16px; padding:40px;">
      <h2 style="text-align:center; margin-bottom:6px;">Set a new password</h2>
      <p style="text-align:center; font-size:.88rem; color:var(--text-low); margin-bottom:28px;" id="reset-subtitle">Choose a new password for your account.</p>

      <form id="reset-form">
        <div class="field">
          <label for="new-password">New password</label>
          <input type="password" id="new-password" required autocomplete="new-password">
        </div>
        <div class="field">
          <label for="confirm-password">Confirm new password</label>
          <input type="password" id="confirm-password" required autocomplete="new-password">
        </div>
        <button type="submit" class="btn btn-primary btn-block" id="reset-submit">Reset Password</button>
        <p class="confirm-note" id="reset-status" style="min-height:1.2em; font-size:.82rem; color:var(--text-low); margin-top:12px; text-align:center;"></p>
      </form>
      <p style="text-align:center; font-size:.85rem; color:var(--text-low); margin-top:18px;">
        <a href="login.html" style="color:var(--rust);">Back to Login</a>
      </p>
    </div>
  </div>
</section>

<footer class="site-footer">
  <div class="wrap">
    <div class="footer-bottom">
      <span>© 2026 SentryVo. All rights reserved.</span>
      <a href="https://x.com/SentryVo" target="_blank" rel="noopener noreferrer" style="color:inherit; display:inline-flex; align-items:center; margin:0 10px;" aria-label="SentryVo on X"><svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M18.9 2H22l-7.6 8.7L23 22h-6.9l-5.4-6.6L4.4 22H1.3l8.1-9.3L1 2h7l4.9 6.1L18.9 2Zm-1.2 18h1.9L7.4 4h-2l12.3 16Z"/></svg></a>
      <span>support@sentryvo.com</span>
    </div>
  </div>
</footer>

<script src="script.js"></script>
<script>
  const resetToken = new URLSearchParams(window.location.search).get('token');
  if (!resetToken) {
    document.getElementById('reset-subtitle').textContent = 'This link is missing its reset token — please use the link from your email again.';
    document.getElementById('reset-form').style.display = 'none';
  }

  document.getElementById('reset-form').addEventListener('submit', async function (e) {
    e.preventDefault();
    const submitBtn = document.getElementById('reset-submit');
    const statusEl = document.getElementById('reset-status');
    const newPassword = document.getElementById('new-password').value;
    const confirmPassword = document.getElementById('confirm-password').value;

    if (newPassword !== confirmPassword) {
      statusEl.textContent = 'Passwords do not match.';
      statusEl.style.color = '#0096F5';
      return;
    }
    if (newPassword.length < 6) {
      statusEl.textContent = 'Choose a password at least 6 characters long.';
      statusEl.style.color = '#0096F5';
      return;
    }

    submitBtn.disabled = true;
    submitBtn.textContent = 'Resetting…';
    statusEl.textContent = '';

    try {
      const res = await fetch(`${SENTRYVO_BACKEND_URL}/api/reset-password`, {
        method: 'POST',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ token: resetToken, newPassword }),
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.error || 'Could not reset your password');

      statusEl.textContent = 'Password updated! Redirecting to login…';
      statusEl.style.color = 'var(--sage)';
      setTimeout(() => { window.location.href = 'login.html'; }, 1800);
    } catch (err) {
      statusEl.textContent = err.message;
      statusEl.style.color = '#0096F5';
      submitBtn.disabled = false;
      submitBtn.textContent = 'Reset Password';
    }
  });
</script>
</body>
</html>
